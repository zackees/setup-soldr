[stack.integration]
dockerfile = "tests/cook-rematerialization/Dockerfile"
family = "setup-soldr-rematerialization"
default = true

[stack.integration.volumes]
cargo-home = { scope = "stack", destination = "/root/.cargo" }
rustup-home = { scope = "stack", destination = "/root/.rustup" }
runner = { scope = "stack", destination = "/runner" }

[stack.integration.mounts]
repo = { source = ".", destination = "/repo" }

[task.build-action]
stack = "integration"
cmd = "rm -rf /build && git clone --no-hardlinks /repo /build && cd /build && npm ci && npm run build && cp dist/main.js dist/post.js /repo/dist/ && cp cook/dist/main.js cook/dist/post.js /repo/cook/dist/ && cp cleanup/dist/index.js /repo/cleanup/dist/index.js"

[task.source-path-smoke]
stack = "integration"
cmd = "bash /repo/tests/cook-rematerialization/source_path_smoke.sh"

[stack.remat-seed]
dockerfile = "tests/cook-rematerialization/Dockerfile.synthetic"
family = "setup-soldr-synthetic-rematerialization"

[stack.remat-seed.volumes]
cargo-home = { scope = "stack", destination = "/root/.cargo" }
soldr-home = { scope = "stack", destination = "/root/.soldr" }
artifact = { scope = "machine", destination = "/artifact" }

[stack.remat-seed.mounts]
repo = { source = ".", destination = "/repo", readonly = true }

[stack.remat-warm]
dockerfile = "tests/cook-rematerialization/Dockerfile.synthetic"
family = "setup-soldr-synthetic-rematerialization"

[stack.remat-warm.volumes]
cargo-home = { scope = "stack", destination = "/root/.cargo" }
soldr-home = { scope = "stack", destination = "/root/.soldr" }
artifact = { scope = "machine", destination = "/artifact" }

[stack.remat-warm.mounts]
repo = { source = ".", destination = "/repo", readonly = true }

[task.seed-release-rematerialization]
stack = "remat-seed"
cmd = "bash /repo/tests/cook-rematerialization/seed_release.sh"

[task.verify-release-rematerialization]
stack = "remat-warm"
cmd = "bash /repo/tests/cook-rematerialization/verify_release_warm.sh"
